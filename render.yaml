# Déploiement de MediGuide sur Render.
#
# Ce fichier décrit l'infrastructure : Render le lit, crée le service web et la
# base de données, et les relie. Aucun réglage n'est à reprendre à la main,
# hormis les deux secrets marqués « sync: false », qui se saisissent dans le
# tableau de bord et ne figurent donc jamais dans le dépôt.

databases:
  - name: mediguide-db
    databaseName: mediguide
    user: mediguide
    plan: free
    region: frankfurt

services:
  - type: web
    name: mediguide
    runtime: docker
    dockerfilePath: ./docker/Dockerfile.render
    plan: free
    region: frankfurt
    healthCheckPath: /
    envVars:
      - key: APP_NAME
        value: MediGuide
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false

      # Sans cette locale, les noms de jours et de mois du calendrier de prise
      # de rendez-vous s'affichent en anglais.
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: APP_TIMEZONE
        value: UTC

      # Clé de chiffrement des données médicales. À saisir une seule fois dans
      # le tableau de bord : la changer rendrait illisibles les antécédents,
      # les allergies et les prescriptions déjà enregistrés.
      - key: APP_KEY
        sync: false

      # Mot de passe des trois comptes de démonstration. Il doit être déclaré
      # ici, et non ajouté seul dans le tableau de bord : les variables d'un
      # service piloté par Blueprint sont réécrites à chaque synchronisation, et
      # une variable absente de ce fichier disparaît. « sync: false » signifie
      # que la valeur, elle, ne vient pas du dépôt mais du tableau de bord.
      - key: DEMO_PASSWORD
        sync: false

      # Adresses des comptes de démonstration. Sans elles, l'application
      # retombe sur patient@demo.sn, medecin@demo.sn et admin@demo.sn : des
      # domaines fictifs, où aucun courriel ne peut arriver et qui ne
      # correspondent pas aux comptes utilisés en développement. Les renseigner
      # dans le tableau de bord avec de vraies adresses.
      - key: DEMO_PATIENT_EMAIL
        sync: false
      - key: DEMO_MEDECIN_EMAIL
        sync: false
      - key: DEMO_ADMIN_EMAIL
        sync: false
      - key: DEMO_SECRETAIRE_EMAIL
        sync: false

      # Adresse publique du service, renseignée automatiquement par Render.
      - key: APP_URL
        fromService:
          type: web
          name: mediguide
          property: hostport

      # Connexion à la base PostgreSQL créée ci-dessus.
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase: { name: mediguide-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: mediguide-db, property: port }
      - key: DB_DATABASE
        fromDatabase: { name: mediguide-db, property: database }
      - key: DB_USERNAME
        fromDatabase: { name: mediguide-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: mediguide-db, property: password }

      # Sessions, cache et file d'attente passent par la base : le plan gratuit
      # ne comporte ni Redis ni second conteneur.
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync

      # Jeu de démonstration : historique de consultations, questionnaires et
      # compte du secrétariat. L'offre gratuite ne donne pas accès à une
      # console : c'est donc le démarrage du conteneur qui pose ces données,
      # quand cette variable vaut « true ». On la remet à « false » ensuite.
      # Le semis se refuse de lui-même si un historique existe déjà.
      - key: DONNEES_DEMO
        value: "false"

      # Envoi des courriers électroniques.
      #
      # Les confirmations et les rappels doivent partir en production comme en
      # développement : le canal est donc SMTP, et non plus le journal. Ce qui
      # n'est pas un secret — serveur, port, chiffrement — est écrit ici et se
      # pose tout seul au déploiement.
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_ENCRYPTION
        value: tls
      # Ces deux-là seulement sont saisies à la main dans le tableau de bord :
      # l'adresse de l'expéditeur et son mot de passe d'application n'ont pas à
      # figurer dans un dépôt public.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: MediGuide

      # Services cartographiques publics.
      - key: OSRM_URL
        value: https://router.project-osrm.org
      - key: NOMINATIM_URL
        value: https://nominatim.openstreetmap.org
